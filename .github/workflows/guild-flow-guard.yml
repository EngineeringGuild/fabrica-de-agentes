name: guild-flow-guard

on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pin the shared governance action to a reviewed hub commit instead of @main.
      # Upgrade deliberately by PR when the hub guard evolves.
      - uses: EngineeringGuild/Engineering-Guild/.github/actions/guild-flow-guard@a88fad3966b5c416a113d929b214e6c1a0c6c59d

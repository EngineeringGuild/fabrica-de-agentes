name: guild-flow-guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Private cross-repo action resolution currently fails for a raw commit SHA
      # in this repository (`Unable to resolve action ... not found`). The org's
      # existing working pattern is @main. Keep this explicit supply-chain debt and
      # move back to a reviewed immutable ref once private-action SHA resolution is
      # verified for the real GitHub App/Actions identities.
      - uses: EngineeringGuild/Engineering-Guild/.github/actions/guild-flow-guard@main

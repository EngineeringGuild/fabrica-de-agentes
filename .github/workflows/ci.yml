name: Fábrica CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Static + automation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python automation
        run: python -m compileall -q automation

      - name: Parse tracked JSON
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ['git', 'ls-files', '*.json'], text=True
          ).splitlines()
          for raw in tracked:
              path = Path(raw)
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK {path}')
          print(f'Validated {len(tracked)} tracked JSON file(s).')
          PY

      - name: Verify minimum static-site contract
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path('index.html'),
              Path('gratis/index.html'),
              Path('obrigado/index.html'),
              Path('robots.txt'),
              Path('sitemap.xml'),
              Path('CNAME'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing required site artifact(s): ' + ', '.join(missing))
          for path in required:
              if path.stat().st_size == 0:
                  raise SystemExit(f'Empty required site artifact: {path}')
              print(f'OK {path}')
          PY

      - name: Diff hygiene
        run: git diff --check

  no-publish:
    name: CI never publishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert validation workflow has no publish secrets or deploy command
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/ci.yml').read_text(encoding='utf-8').lower()
          forbidden = [
              'instagram_access_token',
              'instagram_business_account_id',
              'wrangler publish',
              'wrangler deploy',
              'pages deploy',
          ]
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit('CI validation workflow must remain non-publishing: ' + ', '.join(found))
          print('CI validation path is non-publishing.')
          PY
